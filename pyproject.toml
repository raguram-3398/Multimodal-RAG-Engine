[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-rag-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "numpy",
    "pandas",
    "pinecone>=7",
    "pyarrow",
    "pypdf",
    "python-dotenv",
    "rank-bm25",
    "sentence-transformers",
    "streamlit",  # the app (and tests/test_app.py)
    "unstructured[pdf]>=0.27,<0.28",
    # eval; ragas 0.4.3 fails to import with langchain-community 0.4.x
    "ragas==0.4.3",
    "langchain-anthropic",
    "langchain-community<0.4",
    "langchain-huggingface",
]
# System tools for OCR: tesseract and poppler (pdftoppm).

[dependency-groups]
dev = ["black", "pytest", "ruff"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["multimodal_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 88
target-version = ["py312"]
